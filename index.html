<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charlotte's House</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #c8ccd0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app, #app canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; top: 12px; left: 12px; padding: 8px 12px; background: rgba(20, 20, 22, 0.62); color: #f2f2f2; border-radius: 6px; pointer-events: none; }
      #hud .room { font-size: 16px; font-weight: 600; }
      #hud .meta { font-size: 11px; opacity: 0.75; margin-top: 2px; font-variant-numeric: tabular-nums; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55); pointer-events: none; }
      #prompt { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); padding: 4px 10px; background: rgba(20, 20, 22, 0.7); color: #f4f4f4; font-size: 14px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
      #prompt[hidden] { display: none; }
      #overlay { position: fixed; bottom: 152px; left: 50%; transform: translateX(-50%); cursor: pointer; }
      #overlay[hidden] { display: none; }
      #overlay .card { background: rgba(20, 20, 22, 0.75); color: #f2f2f2; padding: 7px 14px; border-radius: 6px; text-align: center; white-space: nowrap; }
      #timebar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: 10px 14px 8px; background: rgba(20, 20, 22, 0.68); color: #f2f2f2; border-radius: 8px; font-size: 12px; }
      #timebar .row { display: flex; align-items: center; gap: 8px; }
      #timebar .clock { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
      #timebar .date { opacity: 0.75; margin-right: auto; }
      #timebar button { background: rgba(255, 255, 255, 0.12); color: inherit; border: 0; border-radius: 4px; padding: 3px 9px; font-size: 13px; cursor: pointer; }
      #timebar button:hover { background: rgba(255, 255, 255, 0.24); }
      #timebar .speed { min-width: 150px; text-align: right; opacity: 0.85; font-variant-numeric: tabular-nums; }
      #timebar input[type="range"] { width: 100%; margin: 8px 0 0; accent-color: #f0b050; }
      #timebar .ticks { display: flex; justify-content: space-between; opacity: 0.5; font-size: 10px; margin-top: -2px; }
      #timebar .sky, #timebar .keys { opacity: 0.75; margin-top: 3px; }
      #timebar .keys { opacity: 0.5; font-size: 11px; }
      #overlay .card b { font-size: 14px; }
      #overlay .card span { font-size: 13px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="prompt" hidden></div>
    <div id="hud"></div>
    <div id="timebar"></div>
    <div id="overlay">
      <div class="card">
        <b>Click the view to walk</b> <span>· mouse looks · W A S D walk · Shift faster · E doors and curtains · Esc frees the mouse</span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
